<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Hub Ultra - Editor</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="manifest" href="/manifest.json">
  <style>
    .editor-area { width:100%; min-height:320px; background:rgba(0,0,0,0.3); color:#e2e8f0; font-family:monospace; font-size:0.9rem; padding:1rem; border-radius:10px; border:1px solid rgba(255,255,255,0.1); resize:vertical; }
    .toolbar-btn { padding:0.4rem 0.9rem; border-radius:8px; border:none; background:rgba(99,102,241,0.2); color:#a5b4fc; cursor:pointer; font-size:0.82rem; margin-right:0.5rem; }
    .toolbar-btn:hover { background:rgba(99,102,241,0.35); }
  </style>
</head>
<body>
  <nav class="app-nav" style="background:rgba(255,255,255,0.04);border-bottom:1px solid rgba(255,255,255,0.08);padding:0.6rem 1.5rem;display:flex;gap:1rem;align-items:center;flex-wrap:wrap;">
    <a href="/index.html" style="color:var(--tone-soft,#888);text-decoration:none;font-size:0.85rem;padding:0.3rem 0.75rem;border-radius:20px;border:1px solid rgba(255,255,255,0.12);">← Home</a>
    <a href="/dashboard.html" style="color:var(--accent,#a5b4fc);text-decoration:none;font-size:0.85rem;padding:0.3rem 0.75rem;border-radius:20px;border:1px solid rgba(165,180,252,0.3);">🏠 Dashboard</a>
    <a href="/bots.html" style="color:var(--accent,#a5b4fc);text-decoration:none;font-size:0.85rem;padding:0.3rem 0.75rem;border-radius:20px;border:1px solid rgba(165,180,252,0.3);">🤖 Bots</a>
    <a href="/workshop.html" style="color:var(--accent,#a5b4fc);text-decoration:none;font-size:0.85rem;padding:0.3rem 0.75rem;border-radius:20px;border:1px solid rgba(165,180,252,0.3);">🛠 Workshop</a>
    <span style="font-size:0.82rem;color:var(--tone-soft,#888);margin-left:auto;">📝 Editor</span>
  </nav>
  <div class="page">
    <div class="page-content glassmorphic" style="padding:2rem;max-width:960px;margin:2rem auto;">
      <h2 style="margin-bottom:0.5rem;">📝 Code Editor</h2>
      <p style="color:var(--tone-soft,#aaa);margin-bottom:1.5rem;">Write and save custom bot scripts. Your code is stored locally and synced to your build reference.</p>
      <div style="display:flex;gap:0.5rem;margin-bottom:1rem;flex-wrap:wrap;">
        <button class="toolbar-btn" onclick="clearEditor()">Clear</button>
        <button class="toolbar-btn" onclick="saveCode()">Save</button>
        <button class="toolbar-btn" onclick="loadCode()">Load</button>
        <button class="toolbar-btn" onclick="copyCode()">Copy</button>
        <button class="toolbar-btn" onclick="insertTemplate()">Insert Template</button>
      </div>
      <textarea id="code-editor" class="editor-area" spellcheck="false" placeholder="// Write your bot script here...
function myBot(input) {
  return 'Hello, ' + input;
}"></textarea>
      <div id="editor-status" style="margin-top:0.75rem;font-size:0.82rem;color:var(--tone-soft,#aaa);">Ready</div>
    </div>
  </div>
  <script>
    const STORAGE_KEY = 'shu_editor_code';
    const editor = document.getElementById('code-editor');
    const status = document.getElementById('editor-status');
    // Load saved code on start
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) editor.value = saved;
    function clearEditor() { editor.value = ''; status.textContent = 'Editor cleared.'; }
    function saveCode() {
      localStorage.setItem(STORAGE_KEY, editor.value);
      status.textContent = 'Saved at ' + new Date().toLocaleTimeString();
    }
    function loadCode() {
      const v = localStorage.getItem(STORAGE_KEY);
      if (v) { editor.value = v; status.textContent = 'Code loaded.'; }
      else status.textContent = 'No saved code found.';
    }
    function copyCode() {
      navigator.clipboard.writeText(editor.value).then(() => { status.textContent = 'Copied to clipboard!'; }).catch(() => { status.textContent = 'Copy failed - try selecting manually.'; });
    }
    function insertTemplate() {
      const tpl = `// Bot Template\nfunction run(input, context) {\n  const response = 'Processing: ' + input;\n  return { output: response, status: 'ok' };\n}\nexport default { run };`;
      editor.value = tpl;
      status.textContent = 'Template inserted.';
    }
    // Auto-save every 30s
    setInterval(saveCode, 30000);
  </script>
  <script src="/js/main.js" type="module"></script>
</body>
</html>
