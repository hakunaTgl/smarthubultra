<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Hub Ultra - Inspiration</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="manifest" href="/manifest.json">
</head>
<body>
  <nav class="app-nav" style="background:rgba(255,255,255,0.04);border-bottom:1px solid rgba(255,255,255,0.08);padding:0.6rem 1.5rem;display:flex;gap:1rem;align-items:center;flex-wrap:wrap;">
    <a href="/index.html" style="color:var(--tone-soft,#888);text-decoration:none;font-size:0.85rem;padding:0.3rem 0.75rem;border-radius:20px;border:1px solid rgba(255,255,255,0.12);">← Home</a>
    <a href="/dashboard.html" style="color:var(--accent,#a5b4fc);text-decoration:none;font-size:0.85rem;padding:0.3rem 0.75rem;border-radius:20px;border:1px solid rgba(165,180,252,0.3);">🏠 Dashboard</a>
    <span style="font-size:0.82rem;color:var(--tone-soft,#888);margin-left:auto;">✨ Inspiration</span>
  </nav>
  <div class="page">
    <div class="page-content glassmorphic" style="padding:2rem;max-width:900px;margin:2rem auto;">
      <h2 style="margin-bottom:0.5rem;">✨ Inspiration</h2>
      <p style="color:var(--tone-soft,#aaa);margin-bottom:2rem;">Discover ideas, prompts, and use cases to spark your next bot creation.</p>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1.2rem;" id="inspiration-grid"></div>
    </div>
  </div>
  <script>
    const ideas = [
      { emoji: '💬', title: 'Customer FAQ Bot', desc: 'Auto-answer the top 20 support questions from your docs.' },
      { emoji: '📅', title: 'Scheduler Bot', desc: 'Parse natural language to schedule events and send reminders.' },
      { emoji: '📊', title: 'Analytics Summarizer', desc: 'Pull daily metrics and send a digest to Slack or email.' },
      { emoji: '🎙', title: 'Voice Notifier', desc: 'Read out alerts and status updates using speech synthesis.' },
      { emoji: '🔍', title: 'Keyword Watcher', desc: 'Monitor feeds for keywords and trigger workflows automatically.' },
      { emoji: '🤝', title: 'Onboarding Guide', desc: 'Walk new users step-by-step through your product setup.' },
      { emoji: '📧', title: 'Email Triage Bot', desc: 'Classify and tag incoming emails by priority and topic.' },
      { emoji: '📝', title: 'Meeting Summarizer', desc: 'Transcribe and summarize meeting notes into action items.' },
      { emoji: '🛒', title: 'Inventory Tracker', desc: 'Alert when stock drops below threshold and reorder automatically.' },
      { emoji: '🌟', title: 'Daily Motivation Bot', desc: 'Send personalized motivational messages every morning.' },
      { emoji: '🔒', title: 'Security Monitor', desc: 'Watch for unusual login patterns and alert security teams.' },
      { emoji: '🎮', title: 'Game Event Bot', desc: 'Announce in-game events, leaderboards, and achievements in real time.' }
    ];
    const grid = document.getElementById('inspiration-grid');
    ideas.forEach(idea => {
      const card = document.createElement('div');
      card.style.cssText = 'padding:1.25rem;border-radius:12px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);cursor:pointer;transition:background 0.2s;';
      card.innerHTML = '<div style="font-size:2rem;margin-bottom:0.5rem;">' + idea.emoji + '</div><h3 style="margin-bottom:0.4rem;font-size:1rem;">' + idea.title + '</h3><p style="color:var(--tone-soft,#aaa);font-size:0.85rem;">' + idea.desc + '</p><a href="/bots.html" style="display:inline-block;margin-top:0.75rem;font-size:0.8rem;color:#a5b4fc;">Build this →</a>';
      card.onmouseenter = () => card.style.background = 'rgba(99,102,241,0.1)';
      card.onmouseleave = () => card.style.background = 'rgba(255,255,255,0.04)';
      grid.appendChild(card);
    });
  </script>
  <script src="/js/main.js" type="module"></script>
</body>
</html>
